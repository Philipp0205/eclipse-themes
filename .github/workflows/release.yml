name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # a change to the prose or the gallery cannot change what p2 would serve
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# two runs must not race the gh-pages publish
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # The same three checks the build workflow runs. A push to main publishes
      # straight to the update site, so the checks that would have caught a
      # drifted palette or an unparseable GTK rule have to run here too.
      - name: Check token references
        run: ./releng/check-tokens.sh

      - name: Check the GTK palettes against the palette stylesheets
        run: ./releng/check-gtk-palettes.sh

      - name: Check the GTK stylesheet parses
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-gi gir1.2-gtk-3.0 xvfb
          xvfb-run -a ./releng/check-gtk-stylesheet.py

      # The vogella release key, an organization secret. The official site
      # refuses to publish unsigned; a fork without the secret publishes a
      # snapshot and p2 will warn on install, which is the honest outcome.
      - name: Prepare the PGP signing key
        id: gpg
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
        run: |
          if [ -z "$MAVEN_GPG_KEY" ]; then
            if [ "${{ github.repository }}" = "vogellacompany/eclipse-themes" ]; then
              echo "MAVEN_GPG_KEY is not set, refusing to publish an unsigned site" >&2
              exit 1
            fi
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "MAVEN_GPG_KEY is not set, publishing an unsigned snapshot"
            exit 0
          fi
          printf '%s\n' "$MAVEN_GPG_KEY" > "$RUNNER_TEMP/signing-key.asc"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ "${{ steps.gpg.outputs.present }}" = true ]; then
            mvn -B clean verify -Dgpg.skip=false \
              -Dtycho.pgp.signer.bc.secretKeys=$RUNNER_TEMP/signing-key.asc
          else
            mvn -B clean verify
          fi

      # The directory is named after what was actually built, qualifier included,
      # so a rebuild of the same version never lands on an existing URL. All six
      # features carry the same qualifier, so any one of them answers for the build.
      - name: Determine the built version
        id: version
        run: |
          repository=update-site/com.vogella.eclipse.themes.repository/target/repository
          jar=$(find "$repository/features" -name 'com.vogella.eclipse.themes.*.feature_*.jar' | sort | head -1)
          if [ -z "$jar" ]; then
            echo "No feature jar below $repository/features" >&2
            exit 1
          fi
          echo "value=$(basename "$jar" .jar | sed 's/.*\.feature_//')" >> "$GITHUB_OUTPUT"

      - name: Fetch the update site
        run: |
          token_url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$token_url" gh-pages
          else
            mkdir gh-pages
            git -C gh-pages init
            git -C gh-pages checkout -b gh-pages
            git -C gh-pages remote add origin "$token_url"
          fi

      - name: Add the build to the update site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version="${{ steps.version.outputs.value }}"
          rm -rf "gh-pages/releases/$version"
          mkdir -p "gh-pages/releases/$version"
          cp -r update-site/com.vogella.eclipse.themes.repository/target/repository/. "gh-pages/releases/$version"
          # the site carries this build only; everything else is dropped.
          # --only rather than --keep 1, because a qualifier-named directory does
          # not sort above a plainly named one: 1.0.1 beats 1.0.0.202608280419.
          releng/update-composite-site.sh --only "$version" gh-pages

      - name: Publish the update site
        working-directory: gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "The site already carries this build, nothing to publish"
            exit 0
          fi
          git commit -m "Publish ${{ steps.version.outputs.value }}"
          git push -u origin HEAD:gh-pages

      - name: Enable GitHub Pages from gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages" \
            -f 'source[branch]=gh-pages' -f 'source[path]=/' \
            || true

      - name: Attach the repository archive to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find update-site/com.vogella.eclipse.themes.repository/target -maxdepth 1 -name '*.zip' | head -1)
          # the built name carries the Maven -SNAPSHOT suffix, which is misleading on a release
          archive="com.vogella.eclipse.themes.repository-${GITHUB_REF_NAME#v}.zip"
          cp "$built" "$archive"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
